<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoFootball - Sign In</title>
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 px-4 py-12 selection:bg-emerald-500 selection:text-slate-950 font-sans antialiased">

  <!-- Main Login Container Card -->
  <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl shadow-emerald-500/5 backdrop-blur-xl">
    
    <!-- Header Section -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 group transition-transform duration-200 hover:scale-105 mb-4">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="text-2xl font-black tracking-wider text-white">Algo<span class="text-emerald-400">Football</span></span>
      </a>
      <h1 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
      <p class="text-sm text-slate-400 mt-2">Log in to access your premium prediction dashboard.</p>
    </div>

    <!-- Alert / Toast Container -->
    <div id="toast-message" class="hidden mb-6 p-4 rounded-xl text-sm border font-medium flex items-center gap-3 transition-all duration-300">
      <span id="toast-icon" class="shrink-0"></span>
      <p id="toast-text" class="flex-1"></p>
    </div>

    <!-- Login Form Section -->
    <form id="login-form" class="space-y-5" novalidate>
      
      <!-- Email Address Input -->
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <input type="email" id="email" name="email" required placeholder="name@company.com"
            class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input type="password" id="password" name="password" required placeholder="••••••••"
            class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-11 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
          <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none">
            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password Options -->
      <div style="display: none;" class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 cursor-pointer text-slate-400 hover:text-slate-300 transition-colors">
          <input type="checkbox" id="remember-me"
            class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-slate-900 focus:ring-2 cursor-pointer transition-colors">
          <span>Remember me</span>
        </label>
        <button type="button" id="open-forgot-modal" class="font-medium text-emerald-400 hover:text-emerald-300 transition-colors hover:underline">
          Forgot password?
        </button>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn"
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/20 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="btn-text">Sign In</span>
      </button>
    </form>

    <!-- Navigation Redirect Footer -->
    <div class="mt-8 text-center border-t border-slate-800/80 pt-6">
      <p class="text-sm text-slate-400">
        Don't have an account? 
        <a href="signup.html" class="font-semibold text-emerald-400 hover:text-emerald-300 transition-colors underline-offset-4 hover:underline">Sign Up</a>
      </p>
    </div>

  </div>

  <!-- Forgot Password Modal Container -->
  <div id="forgot-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md bg-slate-950/80 transition-opacity duration-300">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative">
      
      <!-- Modal Header -->
      <div class="mb-6">
        <h3 class="text-xl font-bold text-white">Reset Your Password</h3>
        <p class="text-xs text-slate-400 mt-1">Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <!-- Modal Alert Message -->
      <div id="modal-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border flex items-center gap-2">
        <span id="modal-alert-text"></span>
      </div>

      <!-- Modal Form -->
      <form id="forgot-form" class="space-y-4" novalidate>
        <div>
          <label for="reset-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input type="email" id="reset-email" name="reset-email" required placeholder="name@company.com"
              class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" id="close-forgot-modal" class="px-4 py-2.5 rounded-xl border border-slate-700 text-xs font-semibold text-slate-300 hover:bg-slate-800 transition-colors">
            Cancel
          </button>
          <button type="submit" id="reset-submit-btn" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold transition-all shadow-md shadow-emerald-500/10">
            Send Reset Link
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase v12 Module Integration & Client Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDpbpkhq3M4pW3nSBjndf7pwmfNpGEmU1o",
      authDomain: "we-get-54b92.firebaseapp.com",
      projectId: "we-get-54b92",
      storageBucket: "we-get-54b92.firebasestorage.app",
      messagingSenderId: "1048770398145",
      appId: "1:1048770398145:web:fbe7c66361edadd427d140"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Custom ID Generator (YYYY-MM-DD-HH-mm-ss-XXXXX)
    function generateCustomId() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
      const randomStr = Math.random().toString(36).substring(2, 7).toUpperCase();
      return `${timeStr}-${randomStr}`;
    }

    // Traffic Analytics Collector Function
    async function collecterEtSauvegarder(typeInfo) {
      try {
        const storedSession = JSON.parse(localStorage.getItem("algofootball_user_session") || sessionStorage.getItem("algofootball_user_session") || "{}");
        const currentEmail = document.getElementById("email")?.value.trim() || storedSession.email || "guest";

        const payload = {
          event_type: typeInfo,
          timestamp: new Date().toISOString(),
          user_email: currentEmail,
          page_url: window.location.href,
          user_agent: navigator.userAgent
        };

        const documentId = generateCustomId();
        await setDoc(doc(db, "hist_visit_pronostic_site", documentId), payload);
      } catch (err) {
        console.warn("Analytics error:", err);
      }
    }

    // Toast UI Helper
    function showToast(message, type = "error") {
      const toast = document.getElementById("toast-message");
      const text = document.getElementById("toast-text");
      const icon = document.getElementById("toast-icon");

      toast.classList.remove("hidden", "bg-red-500/10", "border-red-500", "text-red-400", "bg-emerald-500/10", "border-emerald-500", "text-emerald-400");
      
      if (type === "error") {
        toast.classList.add("bg-red-500/10", "border-red-500", "text-red-400");
        icon.innerHTML = `<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
      } else {
        toast.classList.add("bg-emerald-500/10", "border-emerald-500", "text-emerald-400");
        icon.innerHTML = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
      }

      text.textContent = message;
    }

    // Session Verification & Redirection
    function checkActiveSessionAndRedirect() {
      try {
        const rawLocal = localStorage.getItem("algofootball_user_session");
        const rawSession = sessionStorage.getItem("algofootball_user_session");
        const session = rawLocal ? JSON.parse(rawLocal) : (rawSession ? JSON.parse(rawSession) : null);

        if (session && session.expiry && new Date().getTime() < session.expiry) {
          if (session.status === "Member") {
            window.location.href = "dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
          return true;
        }
      } catch (e) {
        localStorage.removeItem("algofootball_user_session");
        sessionStorage.removeItem("algofootball_user_session");
      }
      return false;
    }

    // On Page Load Initialization
    document.addEventListener("DOMContentLoaded", () => {
      collecterEtSauvegarder("page_load_login");
      checkActiveSessionAndRedirect();
    });

    // Firebase Auth State Observer Fallback
    onAuthStateChanged(auth, async (user) => {
      if (user && !checkActiveSessionAndRedirect()) {
        try {
          const userDocRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userDocRef);
          const userStatus = userSnap.exists() ? (userSnap.data().status || "Non-Member") : "Non-Member";
          
          const sessionPayload = {
            uid: user.uid,
            email: user.email,
            status: userStatus,
            expiry: new Date().getTime() + (24 * 60 * 60 * 1000)
          };
          localStorage.setItem("algofootball_user_session", JSON.stringify(sessionPayload));

          window.location.href = userStatus === "Member" ? "dashboard.html" : "dashboard.html";
        } catch (e) {
          console.warn("Auth state sync warning:", e);
        }
      }
    });

    // Password Visibility Toggle Logic
    const togglePasswordBtn = document.getElementById("toggle-password");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eye-icon");

    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.innerHTML = isPassword 
        ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 013.682-.783c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-4.092-4.092a3 3 0 11-4.243-4.243" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />`
        : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
    });

    // Login Form Submission
    const loginForm = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const btnSpinner = document.getElementById("btn-spinner");
    const btnText = document.getElementById("btn-text");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;
      const rememberMe = document.getElementById("remember-me").checked;

      if (!email || !password) {
        showToast("Please enter both your email and password.");
        return;
      }

      // UI Loading State
      submitBtn.disabled = true;
      btnSpinner.classList.remove("hidden");
      btnText.textContent = "Signing In...";

      // Track Click Attempt
      collecterEtSauvegarder("click_submit_login");

      try {
        // 1. Firebase Authentication
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Retrieve User Status from Firestore
        let userStatus = "Non-Member";
        try {
          const userDocRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userDocRef);
          if (userSnap.exists()) {
            userStatus = userSnap.data().status || "Non-Member";
          }
        } catch (docErr) {
          console.warn("Could not fetch user document:", docErr);
        }

        // 3. Save Session Storage
        const sessionPayload = {
          uid: user.uid,
          email: user.email,
          fullName: user.displayName || "",
          status: userStatus,
          expiry: new Date().getTime() + (24 * 60 * 60 * 1000)
        };

        if (rememberMe) {
          localStorage.setItem("algofootball_user_session", JSON.stringify(sessionPayload));
        } else {
          sessionStorage.setItem("algofootball_user_session", JSON.stringify(sessionPayload));
        }

        // 4. Success Feedback & Redirection
        showToast("Signed in successfully! Redirecting...", "success");

        setTimeout(() => {
          window.location.href = userStatus === "Member" ? "dashboard.html" : "dashboard.html";
        }, 1000);

      } catch (error) {
        console.error("Login Error:", error);
        
        // Show generic clear error message
        showToast("Invalid email or password. Please try again.", "error");

        // Reset UI State
        submitBtn.disabled = false;
        btnSpinner.classList.add("hidden");
        btnText.textContent = "Sign In";
      }
    });

    // Forgot Password Modal UI Controls
    const forgotModal = document.getElementById("forgot-modal");
    const openForgotBtn = document.getElementById("open-forgot-modal");
    const closeForgotBtn = document.getElementById("close-forgot-modal");
    const forgotForm = document.getElementById("forgot-form");
    const modalAlert = document.getElementById("modal-alert");
    const modalAlertText = document.getElementById("modal-alert-text");

    function openModal() {
      forgotModal.classList.remove("hidden");
      modalAlert.classList.add("hidden");
      const currentLoginEmail = document.getElementById("email").value.trim();
      if (currentLoginEmail) {
        document.getElementById("reset-email").value = currentLoginEmail;
      }
    }

    function closeModal() {
      forgotModal.classList.add("hidden");
    }

    openForgotBtn.addEventListener("click", openModal);
    closeForgotBtn.addEventListener("click", closeModal);
    forgotModal.addEventListener("click", (e) => {
      if (e.target === forgotModal) closeModal();
    });

    // Reset Password Submission
    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const resetEmail = document.getElementById("reset-email").value.trim();

      if (!resetEmail) {
        modalAlert.classList.remove("hidden", "bg-emerald-500/10", "border-emerald-500", "text-emerald-400");
        modalAlert.classList.add("bg-red-500/10", "border-red-500", "text-red-400");
        modalAlertText.textContent = "Please enter your email address.";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, resetEmail);
        modalAlert.classList.remove("hidden", "bg-red-500/10", "border-red-500", "text-red-400");
        modalAlert.classList.add("bg-emerald-500/10", "border-emerald-500", "text-emerald-400");
        modalAlertText.textContent = "Password reset email sent! Check your inbox.";
        
        setTimeout(() => {
          closeModal();
        }, 3000);
      } catch (err) {
        console.error("Password reset error:", err);
        modalAlert.classList.remove("hidden", "bg-emerald-500/10", "border-emerald-500", "text-emerald-400");
        modalAlert.classList.add("bg-red-500/10", "border-red-500", "text-red-400");
        modalAlertText.textContent = "Unable to send reset email. Verify your email address.";
      }
    });
  </script>
</body>
</html>
